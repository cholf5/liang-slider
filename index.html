<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2eadc" />
    <title>梁氏滑动变祖器</title>
    <link rel="stylesheet" href="./style.css" />
    <script>
      window.va = window.va || function () {
        (window.vaq = window.vaq || []).push(arguments);
      };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
  </head>
  <body>
    <main class="page-shell">
      <p class="eyebrow">LIANG'S STATUS CALIBRATOR</p>
      <h1>梁氏滑动变祖器</h1>
      <p class="intro">拖动梁神，调节今日祖率</p>

      <section
        class="slider-stage"
        data-slider-stage
        aria-label="梁氏祖率调节区域"
      >
        <img
          class="slider-background"
          data-slider-background
          src="./img/background.png"
          alt="梁氏滑动变祖器主体"
          draggable="false"
        />
        <img
          class="slider-thumb"
          data-slider-thumb
          src="./img/thumb.png"
          alt="梁文锋头像旋钮"
          draggable="false"
          role="slider"
          tabindex="0"
          aria-label="梁氏祖率调节旋钮"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
          aria-valuetext="0% · 梁神"
        />
      </section>

      <p class="slider-status" data-slider-status>当前祖率：0% · 梁神</p>
      <p class="disclaimer">纯属网络恶搞与视觉玩梗，不代表本人或任何机构观点</p>
    </main>

    <script src="./slider.js"></script>
  </body>
</html>
